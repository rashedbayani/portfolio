@if (project(); as project) {
  <article>
    <h1>{{ project.title }}</h1>
    @if (project.subtitle) {
      <p>{{ project.subtitle }}</p>
    }
    <p>{{ project.description }}</p>
    <dl class="mb-8 border-y border-border py-4">
      <dt class="text-muted-readable">Category</dt>
      <dd class="mb-3 text-secondary">{{ project.category }}</dd>
      <dt class="text-muted-readable">Year</dt>
      <dd class="text-secondary">{{ project.year }}</dd>
    </dl>
    @for (image of project.images; track image.src) {
      <img class="mb-6 rounded-sm border border-border bg-surface" [src]="image.src" [alt]="image.alt" width="1200" height="800">
    }
  </article>
} @else {
  <app-not-found />
}

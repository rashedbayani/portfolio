<a class="skip-link button-primary" href="#main-content">Skip to content</a>
<app-staggered-menu
  [items]="menuItems"
  [isFixed]="true"
  (menuOpen)="menuOpen.set(true)"
  (menuClose)="menuOpen.set(false)"
/>
<main
  class="site-container pt-32 pb-12 sm:pt-40 sm:pb-16"
  id="main-content"
  tabindex="-1"
  [attr.inert]="menuOpen() ? '' : null"
>
  <router-outlet />
</main>
